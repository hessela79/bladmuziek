<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notenmap — bladmuziek</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23b9822f%22><circle cx=%226%22 cy=%2217%22 r=%222.4%22/><circle cx=%2215%22 cy=%2215%22 r=%222.4%22/><path d=%22M8.4 17V6.5L17.4 4.5V13.5%22 stroke=%22%23b9822f%22 stroke-width=%221.6%22 fill=%22none%22/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="viewer-header staff-band">
    <svg class="note-watermark" width="160" height="160" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1" style="top:-30px;right:0;transform:rotate(8deg);">
      <circle cx="6" cy="17" r="2.4" fill="var(--ink)" stroke="none" />
      <circle cx="15" cy="15" r="2.4" fill="var(--ink)" stroke="none" />
      <path d="M8.4 17V6.5L17.4 4.5V13.5" />
      <path d="M8.4 8.5L17.4 6.5" />
    </svg>
    <a href="index.html" class="overview-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6" /></svg>
      Naar het overzicht
    </a>
    <div class="viewer-title-row">
      <div>
        <div id="viewer-title" class="viewer-title serif">…</div>
        <div id="viewer-subtitle" class="viewer-subtitle">…</div>
      </div>
      <!-- Exportknop tijdelijk uitgeschakeld (verwarring over Google Drive-
           voorbeeldweergave) — code blijft intact, alleen de knop is weg. -->
      <button id="export-btn" class="btn-export" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        <span id="export-btn-label">Exporteren</span>
      </button>
    </div>
  </header>

  <main class="viewer-main">
    <div id="pdf-container" class="pdf-container">
      <p id="status" class="status">Bladmuziek wordt geladen…</p>
    </div>
  </main>

  <div class="viewer-footer">
    <a href="index.html" class="overview-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6" /></svg>
      Naar het overzicht
    </a>
  </div>

  <div id="player-bar" class="player-bar" hidden>
    <button id="player-close" class="player-close" aria-label="Sluiten">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>

    <div class="player-info">
      <div id="player-title" class="player-title">—</div>
      <div id="player-desc" class="player-desc"></div>
    </div>

    <div class="player-nav-row">
      <button id="player-prev" class="player-edge-btn" aria-label="Vorige passage" title="Vorige passage">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6l-9 6 9 6z"/></svg>
      </button>

      <div id="player-audio-controls" class="player-audio-controls">
        <button id="player-back5" class="player-btn" aria-label="5 seconden terug" title="5 sec terug">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span>5s</span>
        </button>
        <button id="player-playpause" class="player-btn player-btn-main" aria-label="Afspelen of pauzeren" title="Afspelen/pauzeren">
          <svg id="playpause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l10-7z"/></svg>
        </button>
        <button id="player-fwd5" class="player-btn" aria-label="5 seconden vooruit" title="5 sec vooruit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
          <span>5s</span>
        </button>
        <div class="player-rates" role="group" aria-label="Afspeelsnelheid">
          <button class="rate-btn" data-rate="0.5">0.5x</button>
          <button class="rate-btn active" data-rate="1">1x</button>
          <button class="rate-btn" data-rate="1.5">1.5x</button>
        </div>
      </div>

      <button id="player-next" class="player-edge-btn" aria-label="Volgende passage" title="Volgende passage">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l9 6-9 6z"/></svg>
      </button>
    </div>
  </div>

  <script src="js/vendor/supabase/supabase.js"></script>
  <script src="js/viewer.js" type="module"></script>
</body>
</html>
